name: Facebook page posts
on:
  # Scheduled posting moved to the Worker cron (on time). This workflow is for manual/test posts.
  workflow_dispatch:
    inputs:
      slot: { description: 'Telegram slot hour to post (8,10,12,14,17,19,21). Empty = current hour', required: false }
      dry: { description: 'Dry run (print only)', type: boolean, default: false }
permissions: { contents: read }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fb-post.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SLOT: ${{ inputs.slot || (github.event.schedule == '5 8 * * *' && '10') || (github.event.schedule == '5 10 * * *' && '12') || (github.event.schedule == '5 12 * * *' && '14') || (github.event.schedule == '5 17 * * *' && '19') || (github.event.schedule == '5 19 * * *' && '21') || '' }}
          MAX_LATE_H: ${{ github.event_name == 'schedule' && '4' || '' }}
          DRY: ${{ inputs.dry && '1' || '' }}
