name: Telegram – post a video to the channel
# Manual only: posts a video from media/ to the channel with a caption and buttons, then tries to pin it.
on:
  workflow_dispatch:
    inputs:
      file:
        description: Video file under media/
        default: media/yeshdeal-reel.mp4
      pin:
        description: Pin the post (true/false)
        default: 'true'
      pin_id:
        description: Only pin this existing message id (no new post)
        default: ''
      spec:
        description: Post a prepared photo/video post from media/posts/<name>.json instead
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send video
        run: ls -la media && node scripts/tg-post-video.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FILE: ${{ inputs.file }}
          PIN: ${{ inputs.pin }}
          PIN_ID: ${{ inputs.pin_id }}
          SPEC: ${{ inputs.spec }}
