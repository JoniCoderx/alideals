name: Update coupons & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly (UTC): site refresh + up to 7 Telegram posts a day in Israel-time slots
    # GitHub sometimes skips scheduled runs, so the Cloudflare Worker also dispatches this workflow hourly (see worker/).
  workflow_dispatch:
    inputs:
      telegram_repost:
        description: 'Re-post all current codes to Telegram (with image)'
        type: boolean
        default: false
      cancel_deployment:
        description: 'Commit SHA of a stuck Pages deployment to cancel first (optional)'
        type: string
        default: ''
      announce_now:
        description: 'Post this one-time Telegram announcement id right now (e.g. ann-facebook)'
        type: string
        default: ''
      source:
        description: 'Who triggered the run (the Cloudflare Worker clock sends "clock")'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # used by the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the last successful fetch so a failed API call never empties the site.
      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: data/generated.json
          key: generated-${{ github.run_id }}
          restore-keys: generated-

      - name: Tests
        run: npm test

      - name: Fetch coupons & deals
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          COUPONS_SHEET_CSV_URL: ${{ secrets.COUPONS_SHEET_CSV_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        run: npm run fetch

      # Colour emoji font for the Telegram post images (rendered with headless Chrome).
      - name: Emoji font
        continue-on-error: true
        run: sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null

      # Posts new codes / "ends tomorrow" reminders to the Telegram channel (skips if not configured).
      - name: Telegram channel
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_REPOST: ${{ inputs.telegram_repost && '1' || '0' }}
          ANNOUNCE_NOW: ${{ inputs.announce_now }}
          # With a deployed Worker, regular posts are queued here and published on time by the Worker.
          TELEGRAM_VIA_WORKER: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '1' || '0' }}
        run: node scripts/telegram.mjs

      - name: Save data
        uses: actions/cache/save@v4
        with:
          path: data/generated.json
          key: generated-${{ github.run_id }}

      # BUILD_STRICT refuses to publish while sample codes or a placeholder affiliate link remain.
      - name: Build site
        env:
          BUILD_STRICT: '1'
        run: npm run build

      # YeshDeal 2.0 preview at /test/ (noindex, isolated: writes only into dist/test/).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API resets that timer, so auto-updates never silently stop.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Clears a Pages deployment stuck "in progress" (otherwise every new deploy is refused).
      - name: Cancel stuck deployment
        if: inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          echo "status before:"; gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.cancel_deployment }}" || true
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.cancel_deployment }}/cancel" -i 2>&1 | head -5
          sleep 10
          echo "status after:"; gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.cancel_deployment }}" || true
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing/Yandex about updated pages right away (only when content was pushed or run manually).
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule' && inputs.source != 'clock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping IndexNow
        run: sleep 30 && node scripts/indexnow.mjs

  # "צייד הדילים" API (Cloudflare Worker). Runs only when CLOUDFLARE_API_TOKEN is set.
  worker:
    if: github.event_name != 'schedule' && inputs.source != 'clock'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          # KV namespace for the Telegram bot (reviews + code reports). Created once; skipped if the token can't manage KV.
          KV_ID=$(npx -y wrangler@4 kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="yeshdeal-bot"||x.title.endsWith("-yeshdeal-bot"));console.log(n?n.id:"")}catch{console.log("")}})')
          if [ -z "$KV_ID" ]; then KV_ID=$(npx -y wrangler@4 kv namespace create yeshdeal-bot 2>&1 | grep -oE '[0-9a-f]{32}' | head -1 || true); fi
          if [ -n "$KV_ID" ]; then printf '\n[[kv_namespaces]]\nbinding = "BOT"\nid = "%s"\n' "$KV_ID" >> wrangler.toml; echo "bot KV: $KV_ID"; else echo "bot KV unavailable (token lacks Workers KV permission)"; fi
          npx -y wrangler@4 deploy
          for k in ALI_APP_KEY ALI_APP_SECRET ALI_TRACKING_ID GH_DISPATCH_TOKEN TELEGRAM_BOT_TOKEN; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx -y wrangler@4 secret put "$k"; fi
          done
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Connect Telegram bot webhook
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && { grep -q 'binding = "BOT"' wrangler.toml 2>/dev/null || npx -y wrangler@4 kv namespace list 2>/dev/null | grep -q yeshdeal-bot; }; then
            S=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-32)
            T="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
            curl -s "$T/setWebhook" --data-urlencode "url=https://yeshdeal-api.joni0000.workers.dev/tg/webhook?v=2" -d "secret_token=$S" --data-urlencode 'allowed_updates=["message","callback_query"]' | head -c 200; echo
            # Bot profile (shown on the bot's page and before /start)
            curl -s "$T/setMyName" -H 'Content-Type: application/json' -d '{"name":"יש דיל! | קופונים לעליאקספרס"}' | head -c 120; echo
            curl -s "$T/setMyShortDescription" -H 'Content-Type: application/json' -d '{"short_description":"הבוט הרשמי של yeshdeal.com: שלחו קישור למוצר מעליאקספרס ונמצא לכם את המחיר הכי טוב + קוד קופון."}' | head -c 120; echo
            curl -s "$T/setMyDescription" -H 'Content-Type: application/json' -d '{"description":"👋 הבוט הרשמי של יש דיל! (yeshdeal.com), אתר קודי הקופון והדילים של עליאקספרס לישראל.\n\n🎯 שלחו לי קישור למוצר מעליאקספרס, ואבדוק אם יש אותו זול יותר וכמה הוא יוצא עם קוד קופון\n✍️ כתיבת ביקורת על האתר: /review\n⚠️ דיווח על קוד שלא עבד: דרך הכפתור \"לא עבד לכם? דווחו\" באתר\n🔥 כל הקודים: yeshdeal.com\n📣 הערוץ: @yeshdeall"}' | head -c 120; echo
            curl -s "$T/setMyCommands" -H 'Content-Type: application/json' -d '{"commands":[{"command":"review","description":"✍️ כתיבת ביקורת על יש דיל"},{"command":"start","description":"👋 התחלה"}]}' | head -c 100; echo
            # Profile photo = the site logo (Bot API setMyProfilePhoto; ignored if not supported)
            curl -s "$T/setMyProfilePhoto" -F 'photo={"type":"static","photo":"attach://p"}' -F "p=@../src/assets/bot-photo.jpg" | head -c 200; echo
          else echo "no bot KV – webhook not set"; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
