<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html{overflow:hidden;width:1200px;height:630px}
body{width:1200px;height:630px;font-family:Rubik,sans-serif;background:#fff8f0;position:relative;overflow:hidden;color:#1f2335}
.bg1{position:absolute;width:700px;height:700px;border-radius:50%;background:#ffe2cc;top:-320px;left:-200px}
.bg2{position:absolute;width:520px;height:520px;border-radius:50%;background:#fff0bf;bottom:-300px;right:-120px}
.wrap{position:absolute;inset:0;height:100%;display:flex;align-items:center;gap:56px;padding:0 60px;justify-content:center;width:1200px}
.tiles{display:grid;grid-template-columns:repeat(3,116px);gap:14px;flex:none}
.t{width:116px;height:126px;border-radius:24px;background:#fff;border:3px solid #ecdfd0;border-bottom-width:10px;display:grid;place-items:center;font-size:76px;font-weight:900;color:#ff6b35}
.t.hot{background:#ff6b35;color:#fff;border-color:#e8541f}
.text{width:600px;flex:none}
h1{font-size:92px;font-weight:900;line-height:1;letter-spacing:-1px}
h1 span{color:#ff6b35}
p{font-size:32px;font-weight:500;color:#4a4f66;margin-top:22px;line-height:1.3}
.pills{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.pill{background:#fff;border:2px solid #ecdfd0;border-radius:999px;padding:9px 18px;font-size:24px;font-weight:700}
.pill.g{background:#25d366;border-color:#1da851;color:#fff}
</style></head><body><div class="bg1"></div><div class="bg2"></div>
<div class="wrap">
<div class="text"><h1>Eretz Ir <span>Online</span></h1>
<p>The classic word game: Country, City, Animal… Open a room, share the link, play.</p>
<div class="pills"><span class="pill g">💬 Share on WhatsApp</span><span class="pill">⏱️ Timer</span><span class="pill">✓ Answer check</span></div></div>
<div class="tiles"><div class="t">A</div><div class="t hot">B</div><div class="t">C</div><div class="t hot">E</div><div class="t">R</div><div class="t">S</div></div>
</div></body></html>
